<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>惊喜内容</title>
<link rel="icon" href="assets/icon.jpg">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230a0a0f'/%3E%3Crect x='47' y='4' width='6' height='92' rx='3' fill='%23e8b96a' opacity='.9'/%3E%3Crect x='47' y='4' width='6' height='92' rx='3' fill='%23f6d79a' opacity='.4' transform='translate(0 2)'/%3E%3Ccircle cx='50' cy='26' r='3' fill='%23f6d79a'/%3E%3Ccircle cx='50' cy='74' r='3' fill='%23f6d79a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;height:100dvh;margin:0;overflow:hidden}
body{background:radial-gradient(120% 90% at 50% -10%,#1a1622 0%,#0a0a0f 60%,#07070b 100%);color:#f2ece0;font-family:"Noto Serif SC",Georgia,"Songti SC",serif}
.sans{font-family:"Noto Sans SC","PingFang SC",system-ui,sans-serif}
.screen{position:fixed;top:0;left:0;right:0;bottom:0;width:100vw;width:100dvw;height:100dvh;display:none;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.screen.active{display:flex}
.beam{position:absolute;left:50%;top:-10%;width:2px;height:130%;transform:translateX(-50%);background:linear-gradient(180deg,transparent,rgba(232,185,106,.3),rgba(232,185,106,.06),transparent);filter:blur(2px);pointer-events:none;animation:beam 9s ease-in-out infinite}
@keyframes beam{0%,100%{opacity:.35}50%{opacity:.7}}

/* 锁屏 */
#vLock{align-items:center;justify-content:center;text-align:center;padding:24px}
.lock-ic{width:clamp(64px,20vw,96px);height:clamp(64px,20vw,96px);border-radius:22%;object-fit:cover;box-shadow:0 0 60px rgba(232,185,106,.35),0 18px 40px rgba(0,0,0,.6)}
.lock-title{margin-top:22px;font-size:clamp(22px,7vw,32px);font-weight:900;letter-spacing:.35em;margin-left:.35em;color:#f6d79a}
.lock-sub{margin-top:8px;font-size:clamp(10px,3vw,13px);color:#9a937f;letter-spacing:.28em}
.lock-box{margin-top:28px;width:min(360px,88vw);display:flex;gap:8px}
.lock-box input{flex:1;min-width:0;background:rgba(255,255,255,.06);border:1px solid rgba(232,185,106,.22);border-radius:12px;color:#f2ece0;font-size:20px;padding:14px 14px;text-align:center;letter-spacing:.3em;outline:none;font-family:"Noto Sans SC",system-ui,sans-serif}
.lock-box input:focus{border-color:#e8b96a;box-shadow:0 0 0 3px rgba(232,185,106,.18)}
.lock-box button{background:linear-gradient(135deg,#f6d79a,#e8b96a);color:#241a08;border:none;border-radius:12px;font-size:16px;font-weight:700;padding:0 20px;cursor:pointer;font-family:"Noto Sans SC",system-ui,sans-serif;min-height:52px}
.lock-err{height:22px;margin-top:12px;font-size:14px;color:#e37d6a;font-family:"Noto Sans SC",system-ui,sans-serif;opacity:0;transition:.3s}
.lock-err.show{opacity:1}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

/* 内容页 */
.topbar{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px clamp(14px,4vw,22px);background:linear-gradient(180deg,rgba(10,10,15,.92),rgba(10,10,15,0))}
.topbar .back{background:none;border:1px solid rgba(232,185,106,.25);color:#f6d79a;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px;font-family:"Noto Sans SC",system-ui,sans-serif}
.topbar .imp{background:none;border:none;color:#9a937f;font-size:12px;cursor:pointer;font-family:"Noto Sans SC",system-ui,sans-serif}
.car-head{width:100%;padding:6px clamp(14px,4vw,22px) 0;display:flex;align-items:center;justify-content:space-between}
.car-head .t{font-size:clamp(18px,5.5vw,24px);font-weight:900;color:#f6d79a}
.car-head .c{font-size:13px;color:#9a937f;font-family:"Noto Sans SC",system-ui,sans-serif}
.car-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;width:100%;position:relative}
.track{display:flex;width:100%;height:100%;transition:transform .45s cubic-bezier(.22,.61,.36,1)}
.slide{flex:0 0 100%;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:clamp(16px,5vw,30px);overflow:auto;-webkit-overflow-scrolling:touch}
.card{width:100%;max-width:94vw;margin:0 auto;background:rgba(20,20,30,.82);border:1px solid rgba(232,185,106,.25);border-radius:18px;padding:clamp(20px,5.5vw,34px);min-height:min(56vh,400px);display:flex;flex-direction:column;justify-content:center;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.card .k{font-size:11px;letter-spacing:.3em;color:#e8b96a;opacity:.85;font-family:"Noto Sans SC",system-ui,sans-serif;margin-bottom:14px}
.card h2{font-size:clamp(20px,6vw,28px);font-weight:900;color:#f6d79a;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.card p{margin-top:14px;font-size:clamp(15px,4.6vw,18px);line-height:2;color:#f2ece0;white-space:pre-wrap;word-break:break-word;letter-spacing:.03em}
.card-media{margin-top:16px;width:100%;border-radius:12px;overflow:hidden;border:1px solid rgba(232,185,106,.18)}
.card-media img{width:100%;display:block;object-fit:cover;max-height:40vh}
.card-media video{width:100%;display:block;max-height:44vh;background:#000}
.card-link{display:inline-block;margin-top:18px;padding:13px 24px;border-radius:12px;background:linear-gradient(135deg,#f6d79a,#e8b96a);color:#241a08;font-size:15px;font-weight:700;text-decoration:none;font-family:"Noto Sans SC",system-ui,sans-serif;box-shadow:0 10px 24px rgba(232,185,106,.25)}
.card.anim-fade{animation:fade .9s ease both}
.card.anim-rise{animation:rise .85s cubic-bezier(.22,.61,.36,1) both}
.card.anim-zoom{animation:zoom .75s cubic-bezier(.22,.61,.36,1) both}
.card.anim-float{animation:float 2.6s ease-in-out infinite}
.card.anim-glow{animation:glow 2.4s ease-in-out infinite}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:translateY(0)}}
@keyframes zoom{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes glow{0%,100%{box-shadow:0 0 16px rgba(232,185,106,.22)}50%{box-shadow:0 0 48px rgba(232,185,106,.62)}}
.car-nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(232,185,106,.12);border:1px solid rgba(232,185,106,.25);color:#f6d79a;font-size:22px;cursor:pointer;z-index:3}
.car-nav.prev{left:6px}.car-nav.next{right:6px}
.dots{display:flex;justify-content:center;gap:8px;width:100%;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px))}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);cursor:pointer;transition:.25s}
.dot.on{background:#e8b96a;transform:scale(1.3)}

/* 生日卡片内的照片墙 / 视频 */
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.ph{aspect-ratio:1;border-radius:8px;border:1px solid rgba(232,185,106,.2);overflow:hidden;background:#12121a;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:50;display:none;align-items:center;justify-content:center}
.lightbox img{max-width:94vw;max-height:90dvh;border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.lightbox .x{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:20px;font-size:34px;color:#f6d79a;cursor:pointer}
.hidden{display:none!important}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="beam"></div>
<input type="file" id="impFile" accept=".json,application/json">

<section class="screen active" id="vLock">
  <img class="lock-ic" src="assets/icon.jpg" alt="黑暗中藏着一束光">
  <h1 class="lock-title">惊喜内容</h1>
  <div class="lock-sub sans">THE UNKNOWN CONTENT</div>
  <div class="lock-box" id="lockBox">
    <input id="pwd" type="password" placeholder="输入密码" autocomplete="off" aria-label="密码">
    <button id="unlockBtn">解锁</button>
  </div>
  <div class="lock-err" id="lockErr"></div>
</section>

<section class="screen" id="vContent">
  <div class="topbar">
    <button class="back" id="backBtn">← 返回锁屏</button>
    <button class="imp" id="impBtn">导入内容</button>
  </div>
  <div class="car-head">
    <div class="t" id="cardTitle"></div>
    <div class="c" id="cardCount"></div>
  </div>
  <div class="car-wrap">
    <button class="car-nav prev" id="prevBtn">‹</button>
    <div class="track" id="track"></div>
    <button class="car-nav next" id="nextBtn">›</button>
  </div>
  <div class="dots" id="dots"></div>
</section>

<div class="lightbox" id="lightbox"><img id="lbImg" alt=""><div class="x" id="lbClose">×</div></div>

<script>
const $=id=>document.getElementById(id);
/* 静默更新源：GitHub 仓库 raw 链接 + jsDelivr CDN 兜底 */
const REMOTE_URLS=[
  "https://raw.githubusercontent.com/kongxinqhl/surprise-content/main/content.json",
  "https://cdn.jsdelivr.net/gh/kongxinqhl/surprise-content@main/content.json"
];
const LS_KEY="jingxi_content_v3";
const LS_VER="jingxi_content_ver";

const DEFAULT_CONTENT={
  version:"1",
  birthday:{nickname:"亲爱的",meetDate:"2023-09-12",
    blessings:["愿你今天被所有温柔以待","生日快乐，我的[称呼]","愿你的眼里永远有光，心里永远有暖","这一年也要好好照顾自己","遇见你，是我最好的幸运"],
    letter:"亲爱的[称呼]：\n\n今天是个特别的日子，是你的生日。\n\n我一直在想，该用怎样的语言，才能把想对你说的话全部说出来。我想了很久，最后决定把它们写成一封信，放在这里，等你自己慢慢读。\n\n谢谢你出现在我的生命里。你的笑，你的好，你身上所有让我心动的细节，都是我最想留住的光。往后的每一年，我都想陪你一起过。\n\n祝你生日快乐。愿你岁岁平安，年年喜乐，永远是我心里那个最好的人。\n\n—— 永远爱你的那个人",
    photos:[]},
  passwords:{
    "520":{title:"写给最爱的人",type:"cards",cards:[{t:"见字如面",p:"有些话，平时开不了口，就写在这里给你。\n这封信，只写给你一个人。"},{t:"关于爱你",p:"爱上你这件事，从来没有让我后悔过。\n你的每一个样子，我都喜欢。"},{t:"往后余生",p:"往后余生，风雪是你，平淡是你。\n只要是你，晚一点也没关系。"},{t:"永远爱你的人",p:"这一页的密码是 520。\n而我心里，早就写满了这三个字。"}]},
    "1314":{title:"一生一世",type:"cards",cards:[{t:"一生",p:"一生很长，我愿用这一生，\n去守一个人、护一份情。"},{t:"我承诺",p:"我承诺：无论岁月如何流转，\n我的目光始终只追随你。"},{t:"一世",p:"一世很短，短到来不及犹豫。\n所以我决定，从此刻开始珍惜你。"},{t:"1314",p:"1314，一生一世。\n这是我送给你，最重的誓言。"}]},
    "521":{title:"藏起来的心里话",type:"cards",cards:[{t:"第一句",p:"其实从第一次见到你，\n我就偷偷把你放进了心里。"},{t:"第二句",p:"和你在一起的时候，\n连时间都变得好温柔。"},{t:"第三句",p:"你大概不知道，\n你笑起来的样子有多好看。"},{t:"第四句",p:"521——我爱你。\n这句话，我只想说给你听。"}]},
    "happy":{title:"生日惊喜祝福",type:"cards",cards:[{t:"生日快乐",p:"祝你生日快乐！\n愿这一天的你，是最开心、最闪亮的你。"},{t:"美好祝愿",p:"愿你所有的愿望都能实现，\n所有的美好都如期而至。"},{t:"永远开心",p:"往后的日子，记得要快乐。\n因为你值得这世界上所有的好。"}]},
    "0709":{title:"纪念日回忆",type:"cards",cards:[{t:"初见",p:"那一天，我们第一次遇见。\n也许当时谁也没想到，后来我们会走这么远。"},{t:"同行",p:"一路走来，有欢笑也有风雨。\n幸好，是你陪我一起走过。"},{t:"今天",p:"今天我们依然在一起。\n这本身就是最好的礼物。"},{t:"未来",p:"愿未来的每一个纪念日，\n我们都能一起度过。"}]},
    "0912":{title:"生日惊喜",type:"birthday",cards:[
      {t:"生日快乐",p:"亲爱的[称呼]，生日快乐！\n愿这一天的你，是最开心、最闪亮的你。"},
      {t:"认识天数",p:"__DAYS__"},
      {t:"一封生日信",p:"__LETTER__"},
      {t:"回忆照片墙",p:"__PHOTOS__"}
    ]}
  }
};

let content=null;
function validContent(c){ return c && c.passwords && typeof c.passwords==="object" && Object.keys(c.passwords).length>0; }
function useContent(j){ content=j; try{ localStorage.setItem(LS_KEY,JSON.stringify(content)); if(j.version) localStorage.setItem(LS_VER,String(j.version)); }catch(e){} }
function loadLocal(){ try{ const s=localStorage.getItem(LS_KEY); if(s){ const j=JSON.parse(s); if(validContent(j)) content=j; } }catch(e){} }
loadLocal(); if(!content) content=JSON.parse(JSON.stringify(DEFAULT_CONTENT));

/* 启动：从远程拉取内容，按版本号对比，若更新则静默替换（多源兜底） */
(async function checkRemote(){
  for(const url of REMOTE_URLS){
    try{
      const r=await fetch(url+"?t="+Date.now());
      if(!r.ok) continue;
      const j=await r.json();
      if(!validContent(j)) continue;
      const localVer=content.version||"";
      const remoteVer=(j.version||"");
      if(remoteVer && remoteVer!==localVer){ useContent(j); }
      break;
    }catch(e){}
  }
})();

function d(str,ctx){ return (ctx?str:str||"").replace(/\[称呼\]/g, content.birthday.nickname); }

/* 锁屏 */
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active")); $(id).classList.add("active"); }
function tryUnlock(){
  const pwd=$("pwd").value.trim(), err=$("lockErr"), box=$("lockBox");
  if(!content.passwords[pwd]){ box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake"); err.textContent="密码不对哦 · 再试试看"; err.classList.add("show"); return; }
  err.classList.remove("show");
  const v=$("vLock"); v.classList.add("shake");
  setTimeout(()=>{ v.classList.remove("active"); v.classList.remove("shake"); openEntry(pwd); },520);
}
function openEntry(pwd){
  const entry=content.passwords[pwd];
  if(entry && Array.isArray(entry.cards) && entry.cards.length){ renderCards(entry); show("vContent"); }
  else { $("lockErr").textContent="这个密码还没有内容"; $("lockErr").classList.add("show"); show("vLock"); }
}
$("unlockBtn").addEventListener("click",tryUnlock);
$("pwd").addEventListener("keydown",e=>{ if(e.key==="Enter") tryUnlock(); });
$("pwd").addEventListener("input",()=>$("lockErr").classList.remove("show"));
function forceLock(){ show("vLock"); $("pwd").value=""; $("lockErr").classList.remove("show"); }
$("backBtn").addEventListener("click",forceLock);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") forceLock(); });

/* 卡片轮播（含生日动态卡片解析） */
let curIdx=0, slideCount=0;
function daysBetween(a,b){ const d1=new Date(a).getTime(), d2=new Date(b).getTime(); return Math.max(0,Math.floor((d2-d1)/86400000)); }
function resolveCard(card){
  const b=content.birthday||{};
  let body=d(card.p||"");
  let extra="";
  if(card.t==="认识天数" || String(body).includes("__DAYS__")){
    const now=new Date(); const iso=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
    const days=daysBetween(b.meetDate,iso);
    body=body.replace(/__DAYS__/g, "我们已经认识 <b class='bigdays'>"+days+"</b> 天\n从 "+(b.meetDate||"-")+" 到今天，每一天都算数。");
  }
  if(String(body).includes("__LETTER__")){
    body=body.replace(/__LETTER__/g, d(b.letter||"").replace(/\n/g,"<br>"));
  }
  if(String(body).includes("__PHOTOS__")){
    const photos=b.photos||[];
    if(photos.length){ extra=`<div class="ph-grid">${photos.map(src=>`<div class="ph" onclick="openLb('${src.replace(/'/g,"\\'")}')"><img src="${src}"></div>`).join("")}</div>`; }
    else { extra=`<div class="ph-grid">${[1,2,3,4,5,6].map(i=>`<div class="ph"><div style="display:flex;align-items:center;justify-content:center;height:100%;color:#9a937f;font-size:11px;font-family:'Noto Sans SC',sans-serif">回忆 ${i}</div></div>`).join("")}</div>`; }
    body=body.replace(/__PHOTOS__/g,"");
  }
  let media="";
  if(card.img) media+=`<div class="card-media"><img src="${card.img}" onclick="openLb('${card.img.replace(/'/g,"\\'")}')"></div>`;
  if(card.v) media+=`<div class="card-media"><video src="${card.v}" controls playsinline preload="metadata"></video></div>`;
  if(card.link) media+=`<a class="card-link" href="${card.link}" target="_blank" rel="noopener">打开链接 ›</a>`;
  return `<div class="k">CARD</div><h2>${d(card.t||"")}</h2>${body?`<p>${body}</p>`:""}${extra}${media}`;
}
function renderCards(entry){
  curIdx=0;
  $("cardTitle").textContent=entry.title;
  const track=$("track"); track.innerHTML="";
  entry.cards.forEach(c=>{ const div=document.createElement("div"); div.className="slide"; div.innerHTML=`<div class="card" data-anim="${c.anim||""}">${resolveCard(c)}</div>`; track.appendChild(div); });
  slideCount=track.children.length;
  renderDots(); updatePos(); updateCount();
}
function updatePos(){ $("track").style.transform=`translateX(-${curIdx*100}%)`; playCardAnim(curIdx); }
function playCardAnim(idx){
  const slides=$("track").children;
  for(let i=0;i<slides.length;i++){
    const card=slides[i].querySelector(".card"); if(!card) continue;
    const anim=card.getAttribute("data-anim");
    if(!anim||anim==="none") continue;
    if(i===idx){ card.classList.remove("anim-"+anim); void card.offsetWidth; card.classList.add("anim-"+anim); }
    else card.classList.remove("anim-"+anim);
  }
}
function updateCount(){ $("cardCount").textContent=(slideCount?`${curIdx+1} / ${slideCount}`:""); }
function renderDots(){ const dots=$("dots"); dots.innerHTML=""; for(let i=0;i<slideCount;i++){ const b=document.createElement("div"); b.className="dot"; b.onclick=()=>{curIdx=i;updatePos();updateCount();renderDots();}; dots.appendChild(b);} [...dots.children].forEach((dd,ix)=>dd.classList.toggle("on",ix===curIdx)); }
function next(){ if(curIdx<slideCount-1){curIdx++;updatePos();updateCount();renderDots();} }
function prev(){ if(curIdx>0){curIdx--;updatePos();updateCount();renderDots();} }
$("nextBtn").addEventListener("click",next);
$("prevBtn").addEventListener("click",prev);
let tx=0,ty=0,swiping=false;
$("car-wrap").addEventListener("touchstart",e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; swiping=true; });
$("car-wrap").addEventListener("touchend",e=>{ if(!swiping)return; swiping=false; const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty; if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)){ dx<0?next():prev(); } });

function openLb(src){ $("lbImg").src=src; $("lightbox").style.display="flex"; }
$("lbClose").addEventListener("click",()=>$("lightbox").style.display="none");
$("lightbox").addEventListener("click",e=>{ if(e.target===e.currentTarget) $("lightbox").style.display="none"; });

/* 导入内容 */
$("impBtn").addEventListener("click",()=>$("impFile").click());
$("impFile").addEventListener("change",e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ try{ const obj=JSON.parse(r.result); if(!validContent(obj)) throw new Error("bad"); useContent(obj); alert("内容导入成功，已应用最新内容。"); }catch(_){ alert("导入失败：文件不是有效的内容 JSON。"); } }; r.readAsText(f); e.target.value=""; });
</script>
</body>
</html>
